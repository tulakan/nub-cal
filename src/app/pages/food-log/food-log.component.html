<section class="summary">
  <app-macro-summary
    variant="hero"
    [target]="log.targets()"
    [consumed]="log.consumed()"
  />
</section>

<div class="sect-head">
  <div class="sect-title">Logged · {{ log.items().length }}</div>
  <button
    type="button"
    class="more"
    aria-label="More actions"
    [matMenuTriggerFor]="menu"
  >
    <mat-icon>more_vert</mat-icon>
  </button>
  <mat-menu #menu="matMenu">
    <button mat-menu-item [disabled]="!log.items().length" (click)="clearAll()">
      Clear today's log
    </button>
  </mat-menu>
</div>

@if (!rows().length) {
  <app-empty-state
    icon="restaurant"
    title="Nothing logged yet"
    hint="Tap Add to log your first meal"
  />
} @else {
  <div class="list">
    @for (row of rows(); track row.key) {
      @if (row.kind === 'item') {
        <app-swipe-row (delete)="removeItem(row.item)">
          <button type="button" class="item nub-row-btn" (click)="edit(row.item)">
            <div class="l1">
              <span class="name">{{ row.item.food.name }}</span>
              <span class="kcal num">{{ row.item.calculatedNutrition.kcal | kcal }}</span>
            </div>
            <div class="l2 num">
              <span class="amt">{{ row.item.servingSize | macro: 1 }} {{ row.item.food.unit }}</span>
              <app-macro-chips
                [protein]="row.item.calculatedNutrition.protein"
                [carb]="row.item.calculatedNutrition.carb"
                [fat]="row.item.calculatedNutrition.fat"
              />
            </div>
          </button>
        </app-swipe-row>
      } @else {
        <app-swipe-row (delete)="removeGroup(row)">
          <button
            type="button"
            class="item nub-row-btn"
            [attr.aria-expanded]="expanded().has(row.key)"
            (click)="toggle(row.key)"
          >
            <div class="l1">
              <span class="name">
                <mat-icon class="gicon">restaurant_menu</mat-icon>{{ row.name }}
              </span>
              <span class="kcal num">{{ row.nutrition.kcal | kcal }}</span>
            </div>
            <div class="l2 num">
              <span class="amt">{{ row.items.length }} items</span>
              <app-macro-chips
                [protein]="row.nutrition.protein"
                [carb]="row.nutrition.carb"
                [fat]="row.nutrition.fat"
              />
              <mat-icon class="chev">{{
                expanded().has(row.key) ? 'expand_less' : 'expand_more'
              }}</mat-icon>
            </div>
          </button>
        </app-swipe-row>
        @if (expanded().has(row.key)) {
          <div class="children">
            @for (child of row.items; track child.id) {
              <app-swipe-row (delete)="removeItem(child)">
                <button type="button" class="item child nub-row-btn" (click)="edit(child)">
                  <div class="l1">
                    <span class="name">{{ child.food.name }}</span>
                    <span class="kcal num">{{ child.calculatedNutrition.kcal | kcal }}</span>
                  </div>
                  <div class="l2 num">
                    {{ child.servingSize | macro: 1 }} {{ child.food.unit }}
                  </div>
                </button>
              </app-swipe-row>
            }
          </div>
        }
      }
    }
  </div>
}

<button type="button" class="nub-fab" (click)="openAdd()">
  <mat-icon>add</mat-icon>
  Add
</button>
