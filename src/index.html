<!doctype html>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="preconnect" href="https://identitytoolkit.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <!-- Splash shown before Angular boots; same look as the splash in AppComponent -->
  <style>
    .boot-splash { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 16px; align-items: center; justify-content: center; background: #ffffff; font-family: Roboto, system-ui, sans-serif; }
    .boot-splash .logo { width: 72px; height: 72px; border-radius: 22px; background: #8fd8a8; color: #0f3d24; display: flex; align-items: center; justify-content: center; animation: boot-pulse 1.2s ease-in-out infinite; }
    .boot-splash .label { font-size: 14px; color: #666666; }
    @keyframes boot-pulse { 50% { transform: scale(0.94); opacity: 0.8; } }
    @media (prefers-reduced-motion: reduce) { .boot-splash .logo { animation: none; } }
  </style>
</head>

  <app-root>

        <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.05 8.05c-2.73 2.73-2.73 7.15-.02 9.88 1.47-3.4 4.09-6.24 7.37-7.93-2.78 2.34-4.73 5.61-5.39 9.32 2.6 1.23 5.8.78 7.95-1.37C19.43 14.47 20 4 20 4S9.53 4.57 6.05 8.05z"/></svg>
      </div>
      <div class="label">Loading…</div>
    </div>
  </app-root>
